name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features ml-fasttext -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace

      - name: Cache lid.176.bin
        id: cache-model
        uses: actions/cache@v4
        with:
          path: ~/.cache/language-identifier/lid.176.bin
          key: lid-176-bin-v1

      - name: Download lid.176.bin
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/language-identifier
          curl -fsSL -o ~/.cache/language-identifier/lid.176.bin \
            https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin

      - name: Test with ml-fasttext
        env:
          LANGUAGE_IDENTIFIER_MODEL_PATH: /home/runner/.cache/language-identifier/lid.176.bin
        run: cargo test -p language-identifier --features ml-fasttext

  build-check:
    name: build-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
