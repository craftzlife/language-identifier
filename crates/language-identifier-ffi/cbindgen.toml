language = "C"
header = "/* language-identifier C ABI — generated by cbindgen, do not edit by hand. */"
include_guard = "LANGUAGE_IDENTIFIER_H"
documentation = true
documentation_style = "c99"
no_includes = false
sys_includes = ["stddef.h", "stdint.h"]
tab_width = 4
style = "type"

[export]
# Only the hand-rolled C ABI surface. UniFFI also emits #[no_mangle]
# extern "C" symbols (uniffi_*) but those are an internal protocol
# consumed by uniffi-bindgen, not by C/C# consumers.
include = ["lid_identify", "lid_identify_lines", "lid_string_free"]
