[package]
name = "language-identifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Layered language identification for short and multi-line text inputs."
build = "build.rs"

[features]
default = []
# Ships the default `MlClassifier` impl backed by Meta/FAIR's
# `lid.176.bin`. The `fasttext` crate is a pure-Rust port (no C++ FFI),
# so enabling this feature adds two transitive deps (`rayon`,
# `thiserror`) but no native build requirements.
ml-fasttext = ["dep:fasttext"]
# Ships the default `LlmResolver` impl backed by Apple's on-device
# `FoundationModels` framework (macOS 26+ / iOS 26+, Apple Silicon).
# Compiling this feature requires the Xcode toolchain (`swiftc`) and
# the macOS 26 SDK; linking pulls in `FoundationModels.framework`.
# On non-Apple platforms enabling this feature is a no-op (the impl
# is `#[cfg(target_os = "macos")]`-gated).
llm-apple-foundation = []

[dependencies]
serde = { workspace = true }
unicode-normalization = { workspace = true }
fasttext = { version = "0.8", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
