[package]
name = "language-identifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Layered language identification for short and multi-line text inputs."

[features]
default = []
# Reserved for v4.1: pulls in `fasttext-rs` and ships a default
